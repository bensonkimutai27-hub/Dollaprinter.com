<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main App Container mimicking premium web trading layouts -->
    <div id="app-root" class="trading-workspace-container">
        
        <!-- Header Ribbon Component -->
        <header class="app-header-ribbon">
            <div class="brand-logo-wrapper">
                <span class="logo-accent-text">QUANTUM</span>TRADE
            </div>
            <div class="account-status-pill">
                <div class="status-indicator-dot online"></div>
                <div class="account-type-label">Demo Account</div>
                <div id="balance-display" class="account-balance-amount">$10,000.00</div>
            </div>
        </header>

        <!-- Dynamic Main Stage Layout -->
        <main class="workspace-viewport-stage">
            
            <!-- Asset Stream Graphic Panel -->
            <section class="workspace-card chart-visualization-panel">
                <div class="panel-header-toolbar">
                    
                        <h2 id="active-asset-title">Volatility 100 Index</h2>
                    </div>
                    <div class="live-ticker-price-badge">
                        <span id="live-price-ticker" class="ticker-price-stream">Connecting...</span>
                    </div>
                </div>
                <div class="canvas-render-wrapper">
                    <canvas id="market-canvas-layer"></canvas>
                </div>
            </section>

            <!-- Execution Panel Controller Container -->
            <section class="workspace-card engine-execution-panel">
                <div class="form-control-row">
                    <label class="input-field-header">Market Asset Group</label>
                    <select id="asset-select" class="custom-dashboard-select">
                        <option value="R_100">Volatility 100 Index</option>
                        <option value="R_50">Volatility 50 Index</option>
                        <option value="frxEURUSD">EUR/USD Forex Pair</option>
                    </select>
                </div>

                <div class="form-control-row">
                    <label class="input-field-header">Stake Value Allocation (USD)</label>
                    <div class="numeric-input-wrapper">
                        <input type="number" id="stake-amount" class="custom-dashboard-input" value="10" min="1">
                        <span class="input-currency-suffix">USD</span>
                    </div>
                </div>

                <div class="form-control-row">
                    <label class="input-field-header">Automation Algorithm Logic</label>
                    <select id="strategy-select" class="custom-dashboard-select">
                        <option value="martingale">Martingale Recursive Loop</option>
                    </select>
                </div>

                <!-- Action Button Matrix -->
                <div class="action-trigger-matrix">
                    <button id="start-bot-btn" class="dashboard-action-btn action-prime">Activate Auto-Bot Engine</button>
                    
                    <div class="manual-override-split-row">
                        <button id="btn-rise" class="dashboard-action-btn action-success">▲ Call Option</button>
                        <button id="btn-fall" class="dashboard-action-btn action-danger">▼ Put Option</button>
                    </div>
                </div>

                <!-- Streaming Activity Log Console Terminal -->
                <div class="terminal-logs-component">
                    <h3 class="terminal-header-title">System Activity Log Buffer</h3>
                    <div id="log-console" class="terminal-body-stream">
                        <div class="log-line system-trace">[System]: Initialized workspace matrix container layers...</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Core App Logic Controller Module -->
    <script src="deriv-trading-bot.js"></script>
</body>
</html>
