<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOLLARPRINTER Live Secure Core</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0f12; color: #e4e7eb; padding: 20px; margin: 0; }
        .header-bar { border-bottom: 1px solid #1f262f; padding-bottom: 15px; margin-bottom: 25px; }
        .balance-title { color: #848e9c; font-size: 14px; margin: 0 0 5px 0; }
        .balance-value { font-size: 28px; font-weight: bold; color: #f0b90b; margin: 0; }
        .market-section { background: #161a1e; border-radius: 8px; padding: 20px; border: 1px solid #1f262f; max-width: 400px; }
        .asset-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .asset-name { font-size: 18px; font-weight: 600; }
        .asset-price { font-size: 20px; font-weight: bold; color: #00c076; transition: color 0.2s ease; }
        .input-group { margin-top: 15px; }
        label { display: block; font-size: 12px; color: #848e9c; margin-bottom: 5px; }
        input { background: #24292e; border: 1px solid #3f4651; color: #fff; padding: 10px; border-radius: 4px; width: 90%; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; }
        .btn-buy { background: #00c076; }
        .btn-buy:hover { background: #00a867; }
        .btn-sell { background: #cf304a; }
        .btn-sell:hover { background: #b82a40; }
        .positions-section { margin-top: 25px; max-width: 400px; padding: 10px 0; }
        .status-text { color: #848e9c; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>DOLLARPRINTER Live Secure Core</h2>
        <p class="balance-title">Verified Real Balance</p>
        <p class="balance-value">$25,000.00</p>
    </div>

    <div class="market-section">
        <h3>Active Asset Market</h3>
        
        <div class="asset-row">
            <span class="asset-name">BTC / USD</span>
            <span class="asset-price" id="btc-price">Connecting...</span>
        </div>

        <div class="input-group">
            <label for="amount">Trade Sizing Order Amount</label>
            <input type="number" id="amount" value="0.1" step="0.01">
        </div>

        <div class="btn-group">
            <button class="btn-buy">Instant Buy</button>
            <button class="btn-sell">Instant Sell</button>
        </div>
    </div>

    <div class="positions-section">
        <h3>Active Open Inventory Positions</h3>
        <p class="status-text">No floating asset positions currently active.</p>
        <p style="font-size: 14px; font-weight: 500;">Running Open PnL: <span style="color:#848e9c;">$0.00</span></p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const socket = new WebSocket(wsUrl);

        let lastPrice = 0;

        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === 'PRICE_UPDATE' || message.type === 'INITIAL_PRICES') {
                const btcPrice = message.data.BTC;
                if (btcPrice) {
                    const priceElement = document.getElementById('btc-price');
                    priceElement.innerText = `$${btcPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    
                    if (lastPrice > 0) {
                        if (btcPrice > lastPrice) {
                            priceElement.style.color = '#00c076';
                        } else if (btcPrice < lastPrice) {
                            priceElement.style.color = '#cf304a';
                        }
                    }
                    lastPrice = btcPrice;
                }
            }
        };

        socket.onclose = () => {
            document.getElementById('btc-price').innerText = 'Disconnected';
            document.getElementById('btc-price').style.color = '#848e9c';
        };

        socket.onerror = (error) => {
            console.error('WebSocket connection error:', error);
        };
    </script>
</body>
</html>
