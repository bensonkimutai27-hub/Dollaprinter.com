<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade | Precision Workspace</title>
    <link rel="stylesheet" href="style.css">
    <!-- Charting Library Integration -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">QUANTUM<span>TRADE</span></div>
        <div class="user-profile">
            <span class="badge">Virtual Account</span>
            <span id="balance-display" class="balance">$10,000.00</span>
        </div>
    </header>

    <!-- Main Workspace Grid -->
    <main class="dashboard-grid">
        
        <!-- Left Sidebar: Bot Configuration Controls -->
        <section class="panel bot-config">
            <h2>Bot Control Center</h2>
            <div class="control-group">
                <label for="asset-select">Select Asset</label>
                <select id="asset-select">
                    <option value="R_100">Volatility 100 Index</option>
                    <option value="R_50">Volatility 50 Index</option>
                    <option value="frxEURUSD">EUR/USD Forex</option>
                </select>
            </div>

            <div class="control-group">
                <label for="stake-amount">Stake Amount (USD)</label>
                <input type="number" id="stake-amount" value="10" min="1">
            </div>

            <div class="control-group">
                <label for="strategy-select">Trading Algorithm</label>
                <select id="strategy-select">
                    <option value="martingale">Martingale Multiplier</option>
                    <option value="rsi_trend">RSI Trend Follower</option>
                </select>
            </div>

            <button id="start-bot-btn" class="btn btn-primary">Launch Auto-Bot</button>
        </section>

        <!-- Middle Column: Live Financial Graph Canvas -->
        <section class="panel chart-container">
            <div class="chart-header">
                <h3 id="active-asset-title">Volatility 100 Index</h3>
                <div class="ticker-box">
                    Live Price: <span id="live-price-ticker">Loading...</span>
                </div>
            </div>
            <!-- The charting library will automatically inject the interactive graph canvas inside this wrapper div -->
            <div id="tv-chart-wrapper"></div>
        </section>

        <!-- Right Sidebar: Instant Execution & Operations -->
        <section class="panel trade-execution">
            <h2>Manual Overrides</h2>
            <p class="panel-desc">Instantly buy or sell contracts directly to the market engine.</p>
            
            <div class="execution-buttons">
                <button id="btn-rise" class="btn btn-success">
                    <span class="icon">▲</span> Rise / Call
                </button>
                <button id="btn-fall" class="btn btn-danger">
                    <span class="icon">▼</span> Fall / Put
                </button>
            </div>

            <div class="activity-log">
                <h3>System Activities Log</h3>
                <div id="log-console" class="console">
                    <div class="log-line system">[System]: Workspace initialized. Awaiting API network link...</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Core WebSocket Link -->
    <script src="deriv-trading-bot.js"></script>
</body>
                </html>
