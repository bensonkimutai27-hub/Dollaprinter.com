<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dollarprinter Workspace - Real Execution Terminal</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://jsdelivr.net"></script>
    <script type="text/javascript" src="https://tradingview.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">

    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black tracking-wider text-green-400">DOLLARPRINTER</span>
            <span class="bg-green-500 text-gray-900 text-xs font-bold px-2 py-0.5 rounded-full uppercase tracking-widest">Live Secure Core</span>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-right">
                <p class="text-xs text-gray-400 uppercase font-semibold tracking-wider">Verified Real Balance</p>
                <p id="account-balance" class="text-2xl font-mono font-bold text-green-400">$25,000.00</p>
            </div>
        </div>
    </header>

    <main class="flex h-screen">
        <section class="w-3/4 p-4 h-5/6">
            <div id="tradingview_chart" class="w-full h-full rounded-lg overflow-hidden border border-gray-700"></div>
        </section>

        <section class="w-1/4 bg-gray-800 border-l border-gray-700 p-6 flex flex-col space-y-6">
            <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
                <h2 class="text-sm font-bold text-gray-400 uppercase">Active Asset Market</h2>
                <div class="flex justify-between items-baseline mt-1">
                    <span class="text-lg font-bold">BTC / USD</span>
                    <span id="live-market-ticker" class="text-xl font-mono text-yellow-400">0.00</span>
                </div>
            </div>

            <div class="space-y-4">
                <label class="block text-sm font-bold text-gray-400 uppercase">Trade Sizing Order Amount</label>
                <input id="trade-qty" type="number" value="0.1" step="0.01" min="0.01" class="w-full bg-gray-900 border border-gray-700 rounded p-3 font-mono text-white focus:outline-none focus:border-green-500">
                
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button onclick="submitSimulatedTrade('BUY')" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded uppercase transition duration-150">Instant Buy</button>
                    <button onclick="submitSimulatedTrade('SELL')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded uppercase transition duration-150">Instant Sell</button>
                </div>
            </div>

            <div class="flex-1 bg-gray-900 p-4 rounded-lg border border-gray-700 overflow-y-auto">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Active Open Inventory Positions</h3>
                <div id="position-container" class="space-y-2 text-sm">
                    <p class="text-gray-500 italic">No floating asset positions currently active.</p>
                </div>
                <div class="border-t border-gray-700 mt-4 pt-2 flex justify-between">
                    <span class="text-gray-400 text-xs uppercase font-bold">Running Open PnL:</span>
                    <span id="running-pnl" class="font-mono font-bold">$0.00</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        const socket = io();

        new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": "BINANCE:BTCUSDT",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_chart"
        });

        socket.on('marketUpdate', (packet) => {
            document.getElementById('live-market-ticker').innerText = packet.price.toFixed(2);
            document.getElementById('account-balance').innerText = `$${packet.balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const pnlElement = document.getElementById('running-pnl');
            pnlElement.innerText = (packet.pnl >= 0 ? '+' : '') + `$${packet.pnl.toFixed(2)}`;
            pnlElement.className = packet.pnl >= 0 ? 'text-green-400 font-mono font-bold' : 'text-red-400 font-mono font-bold';

            const container = document.getElementById('position-container');
            if(Object.keys(packet.openPositions).length === 0) {
                container.innerHTML = `<p class="text-gray-500 italic">No floating asset positions currently active.</p>`;
            } else {
                let htmlOutput = '';
                for(let key in packet.openPositions) {
                    let position = packet.openPositions[key];
                    htmlOutput += `
                        <div class="flex justify-between border-b border-gray-800 pb-2">
                            <div>
                                <p class="font-bold text-green-400">${key}</p>
                                <p class="text-xs text-gray-400">Qty: ${position.quantity}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-mono text-gray-300">Entry: $${position.entryPrice.toFixed(2)}</p>
                            </div>
                        </div>`;
                }
                container.innerHTML = htmlOutput;
            }
        });

        function submitSimulatedTrade(action) {
            const qty = parseFloat(document.getElementById('trade-qty').value);
            fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderType: action, quantity: qty })
            })
            .then(res => res.json())
            .then(data => {
                if(!data.success) alert(data.message);
            });
        }
    </script>
</body>
                  </html>
